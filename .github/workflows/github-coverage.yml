# This workflow builds and runs the test suites for the Python and C# examples
# in this repository with code coverage enabled, and uploads the resulting
# Cobertura reports to GitHub's code coverage API.
name: Code Coverage

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  coverage-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install coverage
        shell: bash
        run: pip install coverage

      - name: Run tests with coverage
        # One test in this example is intentionally failing to demonstrate
        # SonarQube's test reporting; coverage is still collected.
        continue-on-error: true
        shell: bash
        working-directory: sonar-scanner/src/python
        run: coverage run -m unittest discover -s tests

      - name: Generate Cobertura coverage report
        shell: bash
        working-directory: sonar-scanner/src/python
        # Matches sonar.python.coverage.reportPaths in sonar-project.properties
        run: coverage xml -o coverage-report/coverage-python.xml

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-python
          path: sonar-scanner/src/python/coverage-report/coverage-python.xml

  upload-coverage-python:
    needs: coverage-python
    if: ${{ !cancelled() && needs.coverage-python.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-python

      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage-python.xml
          language: Python
          label: code-coverage-agent

  coverage-dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Run tests with coverage
        shell: bash
        working-directory: sonar-scanner-dotnet/CSharpProject
        run: dotnet test --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./coverage-results

      - name: Collect Cobertura coverage report
        shell: bash
        working-directory: sonar-scanner-dotnet/CSharpProject
        run: find coverage-results -name 'coverage.cobertura.xml' -exec cp {} coverage.cobertura.xml \;

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-csharp
          path: sonar-scanner-dotnet/CSharpProject/coverage.cobertura.xml

  upload-coverage-csharp:
    needs: coverage-dotnet
    if: ${{ !cancelled() && needs.coverage-dotnet.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-csharp

      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage.cobertura.xml
          language: C#
          label: code-coverage-agent
